services:
  jmusicbot:
    # Build from this checkout; no published fork registry image is assumed.
    build: .
    image: jmusicbot:2610.1.0
    container_name: jmusicbot
    # The container runs as non-root user 'jmusicbot' (UID 10001) for security.
    # Ensure the mounted volume directory is readable/writable by UID 10001,
    # or uncomment the user line below to run as your host user.
    # user: "${UID:-10001}:${GID:-10001}"
    environment:
      # JVM options. Image defaults to ZGC + AlwaysPreTouch; set JAVA_OPTS for heap or other flags:
      # - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseZGC -XX:+AlwaysPreTouch
      {}
    volumes:
      # Mount your config directory. Ensure UID 10001 has read/write access:
      # Set discord.token and discord.owner in config.txt before starting.
      # Linux containers cannot use bundled YouTube; set playback.audioSources.youtube = false.
      #   mkdir -p /your/path/to/musicbot && chown 10001:10001 /your/path/to/musicbot
      - /your/path/to/musicbot:/musicbot
    restart: unless-stopped
