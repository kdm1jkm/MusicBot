name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug Report] Title Here "
labels: []
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Please provide a clear and concise description of what the bug is.
      placeholder: The bug is...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide steps you can take to reliably reproduce this bug
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: What did you expect to happen when this bug occurred?
      placeholder: I expected...
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Debug Output
      description: Please run the `debug` command and paste it here or upload it as an attachment. If you cannot run the command, please provide information about your system such as operating system version, JMusicBot version, etc.
    validations:
      required: true
  - type: textarea
    id: additional-info
    attributes:
      label: Additional Info
      description: Any additional info that you think might be useful or relevant to this bug
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      description: Before submitting your issue, please affirm the following
      options:
        - label: I have checked [this fork's documentation](https://github.com/kdm1jkm/MusicBot/blob/dev/README.md)
          required: true
        - label: I have searched for similar issues [in this fork](https://github.com/kdm1jkm/MusicBot/issues?q=is%3Aissue)
          required: true
        - label: I am reporting a problem with kdm1jkm/MusicBot and have included my fork release version or source commit below
          required: true
  - type: input
    id: version
    attributes:
      label: Fork Version or Commit
      description: Which kdm1jkm/MusicBot release (for example, 2610.1.0) or source commit are you running? Releases are available at https://github.com/kdm1jkm/MusicBot/releases.
    validations:
      required: true
