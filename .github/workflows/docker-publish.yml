name: Publish Docker Image

# Publish only immutable promoted release tags; beta tags never publish latest.
on:
  push:
    tags:
      - 'v*'

# Cancel in-progress runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ !contains(github.ref_name, '.beta-') }}
    
    permissions:
      contents: read
      packages: write  # Required for pushing to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate promoted release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]{2}(0[1-9]|1[0-2])\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          [[ $(git rev-list --parents -n 1 HEAD | wc -w) -eq 3 ]]

      - name: Set up Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Extract metadata
        id: metadata
        run: |
          chmod +x gradlew
          PROJECT_VERSION=$(./gradlew --no-daemon -q printVersion)
          SHA_SHORT=$(git rev-parse --short HEAD)
          
          VERSION="${GITHUB_REF#refs/tags/v}"
          [[ "$VERSION" == "$PROJECT_VERSION" ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION, SHA: $SHA_SHORT"
          echo "sha=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          # For multi-arch images, annotations must be attached to the image index
          # GitHub Packages reads annotations from the index level for multi-arch images
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ steps.metadata.outputs.image_name }}
          # Only validated promoted release tags can update latest.
          tags: |
            type=raw,value=${{ steps.metadata.outputs.version }}
            type=raw,value=latest
            type=raw,value=sha-${{ steps.metadata.outputs.sha }}
          # The application is Apache-2.0; the distribution includes separately licensed components.
          labels: |
            org.opencontainers.image.description=Independent JMusicBot fork with embedded youtube-source playback
            org.opencontainers.image.licenses=NOASSERTION

      - name: Build and push Docker image
        id: build
        uses: ./.github/actions/docker-build
        with:
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          registry: ${{ env.REGISTRY }}
          image-name: ${{ steps.metadata.outputs.image_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"
