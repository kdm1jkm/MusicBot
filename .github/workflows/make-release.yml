name: Make Release

# Existing manual publication path: consume a promoted tag, never change Git refs.
on:
  workflow_dispatch:
    inputs:
      version_number:
        description: 'Existing promoted version (e.g., 2610.1.0)'
        required: true
        type: string
      info:
        description: 'Description of this Release'
        required: true
        type: string

concurrency:
  group: make-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_jar:
    name: Build JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_sha: ${{ steps.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate existing promoted tag
        id: validate
        env:
          VERSION: ${{ inputs.version_number }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]{2}(0[1-9]|1[0-2])\.[0-9]+\.[0-9]+$ ]]
          SHA=$(git rev-parse --verify "refs/tags/v$VERSION^{commit}")
          git merge-base --is-ancestor "$SHA" origin/main
          [[ $(git rev-list --parents -n 1 "$SHA" | wc -w) -eq 3 ]]
          git checkout --detach "$SHA"
          [[ $(git show "$SHA:gradle.properties" | grep '^version=') == "version=$VERSION" ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build with Gradle
        run: bash gradlew --no-daemon build
      - uses: actions/upload-artifact@v6
        with:
          name: jar
          path: build/libs/JMusicBot-${{ inputs.version_number }}-All.jar
          if-no-files-found: error

  create_release:
    name: Create GitHub Release
    needs: build_jar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: jar
          path: .
      - name: Create draft from existing tag
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: v${{ inputs.version_number }}
          name: v${{ inputs.version_number }}
          draft: true
          prerelease: false
          artifacts: JMusicBot-${{ inputs.version_number }}-All.jar
          body: ${{ inputs.info }}
