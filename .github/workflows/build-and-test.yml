name: Build and Test

# Build and test development integration and release promotion.
# This workflow does NOT publish Docker images - that's handled by docker-publish.yml
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read  # Only need to checkout repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and Test with Coverage
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build jacocoTestReport jacocoIntegrationTestReport

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          report_type: coverage
          files: build/reports/jacoco/test/jacocoTestReport.xml,build/reports/jacoco/integrationTest/jacocoIntegrationTestReport.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

  windows:
    name: Windows x64 Bundled Tools
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and Test
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke embedded tool versions from shaded JAR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jars = @(Get-ChildItem build/libs/JMusicBot-*-All.jar)
          if ($jars.Count -ne 1) { throw 'Expected exactly one shaded All JAR' }
          $jar = $jars[0].FullName
          $java = Join-Path $env:JAVA_HOME 'bin/java.exe'
          $launcher = Join-Path $PWD 'build/BundledToolsSmoke.java'
          @'
          import com.jagrosh.jmusicbot.audio.ytdlp.BundledYtDlpRuntime;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.Properties;
          import java.util.concurrent.TimeUnit;

          public class BundledToolsSmoke {
              static void version(Path executable, String expected, boolean allowBuildMetadata) throws Exception {
                  Process process = new ProcessBuilder(executable.toAbsolutePath().toString(), "--version").start();
                  process.getOutputStream().close();
                  try {
                      if (!process.waitFor(15, TimeUnit.SECONDS)) {
                          throw new IllegalStateException("Bundled tool version deadline exceeded");
                      }
                      String output = new String(process.getInputStream().readAllBytes(), StandardCharsets.UTF_8).trim();
                      String versionLine = output.lines().findFirst().orElse("");
                      boolean matches = versionLine.equals(expected)
                              || (allowBuildMetadata && versionLine.startsWith(expected)
                                  && versionLine.startsWith(" (", expected.length())
                                  && versionLine.endsWith(")") && versionLine.length() > expected.length() + 3);
                      if (process.exitValue() != 0 || !matches) {
                          throw new IllegalStateException("Bundled tool version mismatch: " + executable.getFileName());
                      }
                      System.out.println(versionLine);
                  } finally {
                      process.destroyForcibly();
                      process.getInputStream().close();
                      process.getErrorStream().close();
                  }
              }

              public static void main(String[] args) throws Exception {
                  Properties tools = new Properties();
                  try (var manifest = BundledToolsSmoke.class.getResourceAsStream("/ytdlp/windows-x86_64/tools.properties")) {
                      if (manifest == null) throw new IllegalStateException("Missing bundled checksum manifest");
                      tools.load(manifest);
                  }
                  Path directory;
                  try (var runtime = BundledYtDlpRuntime.open()) {
                      directory = runtime.executable().getParent();
                      version(runtime.executable(), tools.getProperty("ytdlp.version"), false);
                      version(runtime.denoExecutable(), "deno " + tools.getProperty("deno.version"), true);
                  }
                  if (Files.exists(directory)) throw new IllegalStateException("Bundled runtime directory leaked");
              }
          }
          '@ | Set-Content -Path $launcher -Encoding utf8
          $smokeDirectory = Join-Path $PWD 'build/Packaged tools 한글 smoke'
          New-Item -ItemType Directory -Path $smokeDirectory | Out-Null
          $oldPath = $env:PATH
          try {
            # No installed yt-dlp, Deno, Python or FFmpeg; no media/network dependency.
            $env:PATH = Join-Path $env:JAVA_HOME 'bin'
            Push-Location $smokeDirectory
            try {
              & $java --enable-native-access=ALL-UNNAMED -cp $jar $launcher
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally {
              Pop-Location
            }
          } finally {
            $env:PATH = $oldPath
            Remove-Item $launcher
          }
