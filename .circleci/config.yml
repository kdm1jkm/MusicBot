version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:25.0
    working_directory: ~/repo
    environment:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3200m
    steps:
      - checkout

      # Restore Gradle dependencies and Wrapper distributions
      - restore_cache:
          keys:
            - v1-gradle-{{ checksum "build.gradle" }}-{{ checksum "gradle.properties" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - v1-gradle-

      # Build the shaded JAR and run unit and integration tests
      - run:
          name: Gradle build
          command: |
            chmod +x gradlew
            ./gradlew --no-daemon build

      # Save Gradle dependencies and Wrapper distributions
      - save_cache:
          key: v1-gradle-{{ checksum "build.gradle" }}-{{ checksum "gradle.properties" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      # Both Gradle test tasks emit JUnit XML beneath this directory
      - store_test_results:
          path: build/test-results

workflows:
  build:
    jobs:
      - build:
          filters:
            branches:
              ignore:
                - gh-pages
                - gh-pages-generated
